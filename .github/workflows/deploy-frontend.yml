name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: shalom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: shalom/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://shalom-technologies-ai-webgen.fly.dev/api
          VITE_EMAILJS_TEMPLATE: template_6napixb
          VITE_EMAILJS_SERVICE: service_slqwvvs
          VITE_EMAILJS_PUBLICKEY: yaYqemY3svI8LU8Fs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v5
        with:
          path: shalom/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5