# fly.toml app configuration file generated for shalom-technologies-ai-webgen on 2026-08-28T09:19:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shalom-technologies-ai-webgen'
primary_region = 'jnb'

[build]
[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
